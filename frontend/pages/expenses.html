<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garden Expenses – Urban Oasis</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .dash-layout{display:flex;min-height:100vh}
    @media(max-width:1024px){.main-content{margin-left:0!important}}
    .exp-table th,.exp-table td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:0.88rem}
    .exp-table th{font-weight:700;color:var(--text-muted);font-size:0.78rem;text-transform:uppercase}
    .exp-table tr:hover td{background:rgba(46,125,50,0.03)}
    .exp-table{width:100%;border-collapse:collapse}
    .cat-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
  </style>
</head>
<body>
<div class="dash-layout">
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div id="top-bar-container"></div>

    <!-- Summary Cards -->
    <div class="grid-4" style="margin-bottom:24px" id="expense-stats"></div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px">
      <!-- Table -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div style="font-weight:700;font-size:1.05rem">All Expenses</div>
          <div style="display:flex;gap:8px">
            <select id="filter-cat" class="form-select" style="padding:8px 12px;font-size:0.85rem" onchange="filterExpenses()">
              <option value="">All Categories</option>
              <option>Seeds</option><option>Pots</option><option>Fertilizer</option><option>Tools</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="openModal('add-expense-modal')">+ Add</button>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="exp-table">
            <thead><tr><th>Date</th><th>Item</th><th>Category</th><th>Shop</th><th>Amount</th><th></th></tr></thead>
            <tbody id="expense-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- Charts -->
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div style="font-weight:700;font-size:0.95rem;margin-bottom:14px">By Category</div>
          <div style="height:180px"><canvas id="cat-chart"></canvas></div>
        </div>
        <div class="card">
          <div style="font-weight:700;font-size:0.95rem;margin-bottom:14px">Monthly Trend</div>
          <div style="height:180px"><canvas id="trend-chart"></canvas></div>
        </div>
        <div class="card" style="background:linear-gradient(135deg,rgba(46,125,50,0.06),rgba(102,187,106,0.04))">
          <div style="font-weight:700;margin-bottom:14px;color:var(--primary)">💡 Savings Analysis</div>
          <div style="font-size:0.88rem;color:var(--text-muted);line-height:1.8">
            <div>Total invested: <strong id="total-invest" style="color:var(--text)">₹0</strong></div>
            <div>Est. market value of produce: <strong id="market-val" style="color:var(--primary)">₹0</strong></div>
            <div>Estimated savings: <strong id="savings" style="color:var(--primary)">₹0</strong></div>
            <div style="margin-top:8px;font-size:0.8rem">Based on local market prices for home-grown vegetables</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add Expense Modal -->
<div class="modal-overlay" id="add-expense-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add Expense</div>
      <div class="modal-close" onclick="closeModal('add-expense-modal')">✕</div>
    </div>
    <div class="form-group"><label class="form-label">Item Name</label><input type="text" id="exp-item" class="form-input" placeholder="e.g. Cherry Tomato Seeds"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Category</label>
        <select id="exp-cat" class="form-select">
          <option>Seeds</option><option>Pots</option><option>Fertilizer</option><option>Tools</option><option>Other</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Amount (₹)</label><input type="number" id="exp-amount" class="form-input" placeholder="120"/></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Date</label><input type="date" id="exp-date" class="form-input"/></div>
      <div class="form-group"><label class="form-label">Shop</label><input type="text" id="exp-shop" class="form-input" placeholder="Local Nursery"/></div>
    </div>
    <button class="btn btn-primary w-full" onclick="addExpense()">Add Expense</button>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../js/app.js"></script>
<script src="../js/dashboard-data.js"></script>
<script src="../js/sidebar.js"></script>
<script>
document.getElementById('sidebar-container').innerHTML = getSidebarHTML('expenses.html');
document.getElementById('top-bar-container').innerHTML = getTopBar('Garden Expense Manager','Track and analyse your garden spending');
document.getElementById('exp-date').value = new Date().toISOString().split('T')[0];

let expenses = Store.get('expenses') || EXPENSE_DATA;
const CAT_COLORS = {Seeds:'#2E7D32',Pots:'#2196F3',Fertilizer:'#FF9800',Tools:'#9C27B0',Other:'#607D8B'};

function renderStats() {
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const thisMonth = expenses.filter(e=>new Date(e.date).getMonth()===new Date().getMonth()).reduce((s,e)=>s+e.amount,0);
  const cats = [...new Set(expenses.map(e=>e.category))].length;
  document.getElementById('expense-stats').innerHTML = `
    <div class="card stat-card animate-slide-up"><div class="stat-icon" style="background:rgba(46,125,50,0.1);color:var(--primary)">💰</div><div><div class="stat-value">₹${total.toLocaleString('en-IN')}</div><div class="stat-label">Total Investment</div></div></div>
    <div class="card stat-card animate-slide-up stagger-1"><div class="stat-icon" style="background:rgba(33,150,243,0.1);color:#2196F3">📅</div><div><div class="stat-value">₹${thisMonth.toLocaleString('en-IN')}</div><div class="stat-label">This Month</div></div></div>
    <div class="card stat-card animate-slide-up stagger-2"><div class="stat-icon" style="background:rgba(255,152,0,0.1);color:#FF9800">🏷️</div><div><div class="stat-value">${cats}</div><div class="stat-label">Categories</div></div></div>
    <div class="card stat-card animate-slide-up stagger-3"><div class="stat-icon" style="background:rgba(76,175,80,0.1);color:#4CAF50">📊</div><div><div class="stat-value">${expenses.length}</div><div class="stat-label">Total Items</div></div></div>`;
  const marketVal = total * 1.6;
  document.getElementById('total-invest').textContent = '₹'+total.toLocaleString('en-IN');
  document.getElementById('market-val').textContent = '₹'+Math.round(marketVal).toLocaleString('en-IN');
  document.getElementById('savings').textContent = '₹'+Math.round(marketVal-total).toLocaleString('en-IN');
}

function renderTable(data) {
  data = data || expenses;
  document.getElementById('expense-tbody').innerHTML = data.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>`
    <tr>
      <td>${new Date(e.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
      <td><div style="font-weight:600">${e.item}</div></td>
      <td><span class="badge" style="background:${CAT_COLORS[e.category]||'#607D8B'}20;color:${CAT_COLORS[e.category]||'#607D8B'}">${e.category}</span></td>
      <td style="color:var(--text-muted)">${e.shop}</td>
      <td><strong>₹${e.amount}</strong></td>
      <td><button onclick="deleteExpense(${e.id})" style="background:none;color:#e53935;font-size:0.9rem;cursor:pointer">🗑️</button></td>
    </tr>`).join('');
}

function filterExpenses() {
  const cat = document.getElementById('filter-cat').value;
  const filtered = cat ? expenses.filter(e=>e.category===cat) : expenses;
  renderTable(filtered);
}

function deleteExpense(id) {
  expenses = expenses.filter(e=>e.id!==id);
  Store.set('expenses',expenses);
  renderStats(); renderTable(); renderCharts();
  Toast.show('Expense deleted','success');
}

function addExpense() {
  const item=document.getElementById('exp-item').value.trim();
  const amount=parseFloat(document.getElementById('exp-amount').value);
  if(!item||!amount){ Toast.show('Fill all required fields','warning'); return; }
  const exp={id:Date.now(),date:document.getElementById('exp-date').value,item,category:document.getElementById('exp-cat').value,amount,shop:document.getElementById('exp-shop').value||'—'};
  expenses.unshift(exp);
  Store.set('expenses',expenses);
  closeModal('add-expense-modal');
  renderStats(); renderTable(); renderCharts();
  Toast.show(`₹${amount} expense added! 💰`,'success');
}

let catChart, trendChart;
function renderCharts() {
  const isDark = ThemeManager.get()==='dark';
  const tc = isDark?'#9ca3af':'#6b7280';
  const gc = isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';

  // Category pie
  const cats = ['Seeds','Pots','Fertilizer','Tools'];
  const totals = cats.map(c=>expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0));
  if(catChart) catChart.destroy();
  catChart = new Chart(document.getElementById('cat-chart').getContext('2d'),{
    type:'doughnut',data:{labels:cats,datasets:[{data:totals,backgroundColor:cats.map(c=>CAT_COLORS[c]),borderWidth:0,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'right',labels:{color:tc,font:{size:10},padding:8,usePointStyle:true}}}}
  });

  // Monthly trend
  const months=['Jan','Feb','Mar','Apr','May','Jun'];
  const mData = months.map((_,i)=>expenses.filter(e=>new Date(e.date).getMonth()===i).reduce((s,e)=>s+e.amount,0));
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trend-chart').getContext('2d'),{
    type:'bar',data:{labels:months,datasets:[{label:'₹ Spent',data:mData,backgroundColor:'rgba(46,125,50,0.7)',borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc},grid:{color:gc}},y:{ticks:{color:tc},grid:{color:gc},beginAtZero:true}}}
  });
}

renderStats(); renderTable(); setTimeout(renderCharts,100);
</script>
</body>
</html>
