<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Urban Oasis</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="width:100%;max-width:440px;padding:20px">
    <div class="card" style="padding:40px">
      <div style="text-align:center;margin-bottom:32px">
        <div style="font-size:3rem;margin-bottom:12px">🔐</div>
        <h1 style="font-size:1.7rem;font-weight:700;margin-bottom:8px">Forgot Password?</h1>
        <p style="color:var(--text-muted);font-size:0.95rem">No worries! Enter your email and we'll send you reset instructions.</p>
      </div>
      <div id="form-section">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-icon">📧</span>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" />
          </div>
          <span class="form-error" id="email-error">Enter a valid email address.</span>
        </div>
        <button class="btn btn-primary w-full btn-lg" id="reset-btn" onclick="sendReset()">Send Reset Link</button>
      </div>
      <div id="success-section" style="display:none;text-align:center">
        <div style="font-size:3rem;margin-bottom:16px">✉️</div>
        <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:12px">Check Your Email</h2>
        <p style="color:var(--text-muted);font-size:0.9rem;line-height:1.7;margin-bottom:24px">
          We've sent a password reset link to <strong id="sent-email"></strong>. Check your inbox and follow the instructions.
        </p>
        <a href="login.html" class="btn btn-primary w-full">Back to Sign In</a>
        <div style="margin-top:16px;font-size:0.85rem;color:var(--text-muted)">
          Didn't receive the email? <a href="#" onclick="sendReset()" style="color:var(--primary)">Resend</a>
        </div>
      </div>
      <div style="text-align:center;margin-top:24px">
        <a href="login.html" style="font-size:0.9rem;color:var(--text-muted)">← Back to Sign In</a>
      </div>
    </div>
    <div style="text-align:center;margin-top:16px">
      <button class="theme-toggle-btn btn btn-ghost btn-sm">🌙 Toggle Theme</button>
    </div>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <script src="../js/app.js"></script>
  <script>
  async function sendReset() {
    const email = document.getElementById('email').value.trim();
    const err = document.getElementById('email-error');
    if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) { err.classList.add('show'); return; }
    err.classList.remove('show');
    const btn = document.getElementById('reset-btn');
    btn.disabled = true; btn.innerHTML = '<div class="spin" style="width:18px;height:18px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;display:inline-block"></div> Sending...';
    await new Promise(r => setTimeout(r, 1500));
    document.getElementById('sent-email').textContent = email;
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';
    Toast.show('Reset link sent! Check your email.', 'success');
  }
  </script>
</body>
</html>
